name: Finish opaque white backgrounds on Vintage60 icons

on:
  push:
    branches: [main]
    paths:
      - scripts/flatten_vintage60_white.py
      - .github/workflows/vintage60-white-background.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten-white-backgrounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Make Vintage60 WebPs opaque
        run: python scripts/flatten_vintage60_white.py
      - name: Save updated images
        run: |
          if ! git diff --quiet -- public/chore-skins/Vintage60; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/chore-skins/Vintage60/*.webp
            git commit -m "Flatten Vintage60 illustrations onto white without changing their artwork"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
