name: Remove chore icon outer borders
on:
  push:
    branches: [main]
    paths:
      - 'scripts/remove_chore_icon_borders.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow numpy scipy
      - run: python scripts/remove_chore_icon_borders.py
      - name: Commit modified chore icons
        run: |
          if ! git diff --quiet -- public/chore-icons; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/chore-icons/*.jpg
            git commit -m "Remove pink frames from chore icons using original ivory backgrounds"
            git push
          fi
