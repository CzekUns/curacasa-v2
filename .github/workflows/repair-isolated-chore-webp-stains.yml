name: Conservatively clean isolated WebP edge stains

on:
  push:
    branches: [main]
    paths:
      - scripts/repair_isolated_chore_webp_stains.py
      - .github/workflows/repair-isolated-chore-webp-stains.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image processing dependencies
        run: python -m pip install pillow numpy opencv-python-headless
      - name: Restore isolated margin stains only
        run: python scripts/repair_isolated_chore_webp_stains.py
      - name: Commit review sheet and repaired WebP assets
        run: |
          if ! git diff --quiet -- public/chore-icons || [ -n "$(git ls-files --others --exclude-standard docs/asset-review/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/chore-icons/*.webp docs/asset-review/chore-edge-cleanup-before-after.webp
            git commit -m "Clean twelve isolated chore icon margin defects without cropping drawings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
