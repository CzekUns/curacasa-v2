name: Validate CuraCasa brand and login UX
on:
  push:
    branches: [design/logo-system-and-airy-hero]
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'public/manifest.webmanifest'
      - 'index.html'
      - 'vite.config.ts'
      - 'package*.json'
      - '.github/workflows/check-brand.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify preset uniqueness and daily completion rules
        run: npm run test:logic
      - name: Build branded GitHub Pages preview
        env:
          VITE_BASE_PATH: /curacasa-v2/
          VITE_DEMO_BYPASS_AUTH: "true"
          SEO_SITE_URL: https://czekuns.github.io/curacasa-v2/
          SEO_INDEXABLE: "false"
        run: npm run build
      - name: Check PWA icon dimensions, metadata and install path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import struct
          brand = Path('dist/brand')
          expected = {
              'icon-192.png': 192,
              'icon-512.png': 512,
              'icon-maskable-512.png': 512,
              'apple-touch-icon.png': 180,
              'favicon-32.png': 32,
              'favicon-16.png': 16,
              'mark-512.png': 512,
          }
          for name, size in expected.items():
              blob = (brand / name).read_bytes()
              assert blob[:8] == b'\x89PNG\r\n\x1a\n', name
              w, h = struct.unpack('>II', blob[16:24])
              assert (w, h) == (size, size), (name, w, h)
          manifest = json.loads(Path('dist/manifest.webmanifest').read_text())
          assert manifest['start_url'] == './#/app'
          assert any(icon.get('purpose') == 'any' and icon.get('src') for icon in manifest['icons'])
          assert (brand / 'favicon.ico').is_file()
          assert (brand / 'mark.svg').is_file()
          assert (brand / 'compact-mark.svg').is_file()
          assert (brand / 'favicon.svg').is_file()
          assert Path('dist/personal-icons/symbols.svg').is_file()
          assert Path('dist/personal-icons/preview.html').is_file()
          assert (brand / 'logo-stacked.svg').is_file()
          assert (brand / 'mark-mono.svg').is_file()
          assert (brand / 'mark-reverse.svg').is_file()
          assert (brand / 'hero-whisper.svg').is_file()
          assert (brand / 'studio.html').is_file()
          from struct import unpack
          horizontal = (brand / 'logo-horizontal-1024.png').read_bytes()
          width, height = unpack('>II', horizontal[16:24])
          assert width == 1024 and 200 <= height <= 400, (width, height)
          stacked = (brand / 'logo-stacked-512.png').read_bytes()
          width, height = unpack('>II', stacked[16:24])
          assert width == 512 and 440 <= height <= 512, (width, height)
          html = Path('dist/index.html').read_text()
          assert 'brand/favicon.svg' in html
          assert 'manifest.webmanifest' in html
          styles = '\n'.join(p.read_text() for p in Path('dist/assets').glob('*.css'))
          assert '#f5e5e1' in styles, 'Shared access-screen gradient missing'
          print('Logo family, aspect ratios, PWA icons and personal illustration assets validated')
          PY
