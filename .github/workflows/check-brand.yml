name: Validate CuraCasa brand and login UX
on:
  push:
    branches: [feat/curacasa-brand-intro-clerk]
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'public/manifest.webmanifest'
      - 'index.html'
      - 'vite.config.ts'
      - 'package*.json'
      - '.github/workflows/check-brand.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build branded GitHub Pages preview
        env:
          VITE_BASE_PATH: /curacasa-v2/
          VITE_DEMO_BYPASS_AUTH: "true"
          SEO_SITE_URL: https://czekuns.github.io/curacasa-v2/
          SEO_INDEXABLE: "false"
        run: npm run build
      - name: Check PWA icon dimensions, metadata and install path
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import struct
          brand = Path('dist/brand')
          expected = {
              'icon-192.png': 192,
              'icon-512.png': 512,
              'icon-maskable-512.png': 512,
              'apple-touch-icon.png': 180,
              'favicon-32.png': 32,
          }
          for name, size in expected.items():
              blob = (brand / name).read_bytes()
              assert blob[:8] == b'\x89PNG\r\n\x1a\n', name
              w, h = struct.unpack('>II', blob[16:24])
              assert (w, h) == (size, size), (name, w, h)
          manifest = json.loads(Path('dist/manifest.webmanifest').read_text())
          assert manifest['start_url'] == './#/app'
          assert any('maskable' in icon.get('purpose', '') for icon in manifest['icons'])
          assert (brand / 'favicon.ico').is_file()
          assert (brand / 'mark.svg').is_file()
          html = Path('dist/index.html').read_text()
          assert 'brand/app-icon.svg' in html
          assert 'brand/apple-touch-icon.png' in html
          print('PWA icon and favicon assets validated')
          PY
