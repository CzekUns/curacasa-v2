name: Apply CuraCasa chore WebP and category ears
on:
  push:
    branches: [main]
    paths:
      - "scripts/migrate_chore_images_and_levels.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pillow
      - run: python scripts/migrate_chore_images_and_levels.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:logic
      - name: Save verified image and UI migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- public/chore-icons public/chore-packs.json src/lib/icons.tsx src/lib/store.ts src/lib/chore-levels.ts src/components/ChoreLevelTag.tsx src/routes/AddChore.tsx src/routes/Chores.tsx src/styles/global.css tsconfig.app.json
          if ! git diff --cached --quiet; then
            git commit -m "Convert chore icons to WebP and add BASE PRO SUPER TUA ears"
            git push
          fi
