name: Render CuraCasa PWA brand icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/brand/*.svg'
      - 'scripts/generate_brand_icons.py'
      - '.github/workflows/render-brand-icons.yml'
permissions:
  contents: write
concurrency:
  group: render-brand-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rasterizer
        run: python -m pip install --disable-pip-version-check cairosvg Pillow
      - name: Render icon assets
        run: python scripts/generate_brand_icons.py
      - name: Save rendered assets to test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/brand/*.png public/brand/favicon.ico
          if ! git diff --cached --quiet; then
            git commit -m 'brand: generate favicon and PWA PNG icons'
            git push
          fi
