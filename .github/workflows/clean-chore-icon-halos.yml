name: Repair chore icon background without shrinking artwork

on:
  push:
    branches: [main]
    paths:
      - 'scripts/clean_chore_icon_halos.py'
      - '.github/workflows/clean-chore-icon-halos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0 # Restore original assets from the commit before the faulty crop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install pillow numpy scipy
      - name: Restore original artwork and extend ivory background
        run: python scripts/clean_chore_icon_halos.py
      - name: Commit repaired WebP icons
        run: |
          if ! git diff --quiet -- public/chore-icons; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/chore-icons/*.webp
            git commit -m "Restore full-size chore illustrations and extend ivory background"
            git push
          fi
