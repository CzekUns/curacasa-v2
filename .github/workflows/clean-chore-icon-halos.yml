name: Remove residual chore illustration halos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/clean_chore_icon_halos.py'
      - '.github/workflows/clean-chore-icon-halos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image tools
        run: python -m pip install pillow
      - name: Make icon exterior transparent and verify alpha
        run: python scripts/clean_chore_icon_halos.py
      - name: Commit cleaned assets
        run: |
          if ! git diff --quiet -- public/chore-icons; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/chore-icons/*.webp
            git commit -m "Remove baked-in pink and beige halos from 14 chore icons"
            git push
          fi
