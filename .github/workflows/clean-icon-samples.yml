name: Clean black halos on sample CuraCasa icons

on:
  push:
    branches:
      - fix/clean-dark-icon-borders

permissions:
  contents: write

jobs:
  clean-icon-samples:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Remove dark halos from representative icons
        run: |
          python scripts/clean_icon_borders.py \
            public/chore-icons/casa.jpg \
            public/chore-icons/aspirapolvere.jpg \
            public/chore-icons/mocio-secchio.jpg \
            public/chore-icons/dyson.jpg
      - name: Commit cleaned sample images to this test branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/chore-icons/*.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'fix: clean dark borders on sample icons'
            git push
          fi
